name: MobileGate release gate

# End-to-end test of prasadnadkarni/mobilegate@v0.4.0 as a GitHub Action.
# Deliberately uses a pinned, checksum-verified real-world APK fetched
# in this workflow rather than a committed binary (redistributing an
# APK isn't ours to do) or a real Gradle build (out of scope for this
# specific test — see mobilegate's own repo for that). The fetched APK
# stands in for "a build artifact produced earlier in the same job" —
# the action doesn't care how the file at apk-path came to exist.
#
# com.simplemobiletools.flashlight_66.apk is a known BLOCKED case
# (MG-003: android:allowBackup="true", no override) from mobilegate's
# own corpus results — deliberately chosen so this test exercises the
# actual failure path (exit code propagation, PR comment on a BLOCKED
# result, and now: SARIF upload on a BLOCKED result — the run where
# Code Scanning findings matter most, and the one most likely to be
# silently skipped by a missing if: always()).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write   # required for the SARIF upload

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch test APK (pinned, checksum-verified)
        run: |
          curl -sSL -o app.apk https://f-droid.org/repo/com.simplemobiletools.flashlight_66.apk
          echo "b4cd07c40a3d5711461670a2f460a1447acf3836c0e90471b7ba5c8b4c2f9bb3  app.apk" | sha256sum -c -

      - name: MobileGate
        uses: prasadnadkarni/mobilegate@v0.4.0
        with:
          apk-path: app.apk
          sarif-file: mobilegate.sarif
