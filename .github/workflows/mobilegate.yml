name: MobileGate release gate

# End-to-end test of prasadnadkarni/mobilegate@v0.1.0 as a GitHub Action.
# Deliberately uses a pinned, checksum-verified real-world APK fetched
# in this workflow rather than a committed binary (redistributing an
# APK isn't ours to do) or a real Gradle build (out of scope for this
# specific test — see mobilegate's own repo for that). The fetched APK
# stands in for "a build artifact produced earlier in the same job" —
# the action doesn't care how the file at apk-path came to exist.
#
# com.keylesspalace.tusky_142.apk is a known PASS case from mobilegate's
# own corpus results (allowBackup explicitly false) — swapped in after
# an earlier commit tested the BLOCKED path with Simple Flashlight, to
# confirm the same PR's sticky comment correctly updates from a BLOCKED
# body to a PASS body, not just refreshes identical content.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch test APK (pinned, checksum-verified)
        run: |
          curl -sSL -o app.apk https://f-droid.org/repo/com.keylesspalace.tusky_142.apk
          echo "3e8fcc49a80d4c30ab6f6037e51402c77e2694d27ec19ae5b8a93cd08b6caffa  app.apk" | sha256sum -c -

      - name: MobileGate
        uses: prasadnadkarni/mobilegate@v0.1.0
        with:
          apk-path: app.apk
